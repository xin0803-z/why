name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify the wheel works before publishing
        run: |
          python -m pip install dist/*.whl
          why --version
          why layers > /dev/null
      - name: Attach the artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Uncomment to publish to PyPI with Trusted Publishing (no API token needed):
  # configure the project on pypi.org to trust this workflow first.
  #
  # pypi:
  #   needs: release
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v4
  #     - uses: pypa/gh-action-pypi-publish@release/v1